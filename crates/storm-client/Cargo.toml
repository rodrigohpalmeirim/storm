[package]
name = "storm-client"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = "1.0.229"
serde_json = "1.0.154"
storm-proto = { version = "0.1.0", path = "../storm-proto" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "io-util", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
storm-engine = { path = "../storm-engine" }
storm-server = { path = "../storm-server" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
